name: Highlight example

on: 
  workflow_dispatch:


jobs:
  highlight:
  
    runs-on: macos-latest
    env:
      SSH_ID: ${{ secrets.TEST }}
    steps:
      - name: Highlight text in HTML
        run: |
          wget https://github.com/nervosnetwork/ckb/releases/download/v0.204.0-rc2/ckb_v0.204.0-rc2_aarch64-apple-darwin-portable.zip
          unzip ckb_v0.204.0-rc2_aarch64-apple-darwin-portable.zip
          ./ckb_v0.204.0-rc2_aarch64-apple-darwin-portable/ckb --version

      - name: Setup upterm session
        if: ${{ always() }}
        uses: lhotari/action-upterm@v1
